[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nec81"
version = "2.2.0"
description = "Python and NumPy implementation of NEC-81 (NEC-2) antenna modeling code"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mike Markowski", email = "mike.ab3ap@gmail.com" },
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7",
]
gui = [
    "matplotlib>=3.7",
    "PySide6>=6.5",
]
full = [
    "matplotlib>=3.7",
    "PySide6>=6.5",
]

[project.scripts]
nec81 = "nec81.nec81:main"
mainsa = "nec81.mainsa:main"

[tool.setuptools.packages.find]
where = ["src"]

